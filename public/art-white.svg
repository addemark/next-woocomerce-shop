<svg xmlns="http://www.w3.org/2000/svg"
     width="420" height="180"
     viewBox="0 0 420 180">

  <!-- All black, easy for foil / emboss / deboss -->
  <g fill="#fff" stroke="none">

    <!-- A symbol: strong triangular shape with bar (abstract A) -->
    <g id="A-symbol" transform="translate(30,30)">
      <!-- Triangular body -->
      <path d="M20 110 L60 10 L100 110 Z" />
      <!-- Crossbar (cut out visually by using a smaller bar of background color if needed in final vector) -->
      <!-- For pure emboss, keep it solid; if you want a bar, your designer can create a knockout -->
      <rect x="38" y="65" width="44" height="12" fill="#fff" />
    </g>

    <!-- R symbol: vertical stem + circular bowl + diagonal leg -->
    <g id="R-symbol" transform="translate(150,30)">
      <!-- Vertical stem -->
      <rect x="20" y="30" width="22" height="80" />
      <!-- Bowl -->
      <path d="M42 30
               H70
               C88 30 100 42 100 60
               C100 78 88 90 70 90
               H42 Z" />
      <!-- Diagonal leg -->
      <path d="M60 90 L105 110 L95 125 L55 105 Z" />
    </g>

    <!-- T symbol: thick crossbar and stem -->
    <g id="T-symbol" transform="translate(280,30)">
      <!-- Top bar -->
      <rect x="10" y="30" width="100" height="20" />
      <!-- Stem -->
      <rect x="50" y="50" width="30" height="60" />
    </g>

    <!-- Small "egani" to complete ARTEGANI -->
    <text x="210" y="165"
          font-family="Didot, 'Bodoni MT', 'Times New Roman', serif"
          font-size="30"
          letter-spacing="2"
          text-anchor="middle"
          dominant-baseline="middle">
      egani
    </text>

  </g>
</svg>
